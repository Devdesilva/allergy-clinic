<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allergy Clinic — Patient Records</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/docx@7.3.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        /* ── TOKENS ───────────────────────────────────────────── */
        :root {
            --navy:    #0a2540;
            --blue:    #1a6fdb;
            --blue-lt: #e8f1fc;
            --teal:    #0d9488;
            --teal-lt: #e6f7f5;
            --red:     #dc2626;
            --red-lt:  #fef2f2;
            --amber:   #d97706;
            --green:   #16a34a;
            --green-lt:#f0fdf4;
            --grey-50: #f8fafc;
            --grey-100:#f1f5f9;
            --grey-200:#e2e8f0;
            --grey-400:#94a3b8;
            --grey-600:#475569;
            --grey-800:#1e293b;
            --white:   #ffffff;
            --radius:  10px;
            --shadow:  0 4px 24px rgba(10,37,64,.10);
            --shadow-sm: 0 2px 8px rgba(10,37,64,.07);
        }

        /* ── RESET & BASE ─────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: var(--grey-800);
            background: var(--grey-100);
            min-height: 100vh;
        }

        /* ── TOP NAV BAR ──────────────────────────────────────── */
        .topbar {
            background: var(--navy);
            color: white;
            padding: 0 24px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,.2);
        }
        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-icon {
            width: 34px; height: 34px;
            background: var(--blue);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .topbar-brand h1 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: .01em;
        }
        .topbar-brand span {
            font-size: 12px;
            color: var(--grey-400);
            font-weight: 400;
        }
        .topbar-nav a {
            color: var(--grey-400);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 6px;
            transition: background .15s, color .15s;
        }
        .topbar-nav a:hover {
            background: rgba(255,255,255,.1);
            color: white;
        }

        /* ── PAGE WRAPPER ─────────────────────────────────────── */
        .page { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

        /* ── STATS ROW ────────────────────────────────────────── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--blue);
        }
        .stat-card.green  { border-color: var(--teal); }
        .stat-card.amber  { border-color: var(--amber); }
        .stat-label { font-size: 12px; color: var(--grey-600); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--navy); margin-top: 2px; }

        /* ── TOOLBAR ──────────────────────────────────────────── */
        .toolbar {
            background: var(--white);
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-wrap {
            position: relative;
            flex: 1;
            min-width: 180px;
        }
        .search-wrap svg {
            position: absolute;
            left: 11px; top: 50%;
            transform: translateY(-50%);
            color: var(--grey-400);
            pointer-events: none;
        }
        .search-wrap input {
            width: 100%;
            padding: 9px 12px 9px 36px;
            border: 1.5px solid var(--grey-200);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color .15s;
            background: var(--grey-50);
        }
        .search-wrap input:focus { border-color: var(--blue); background: white; }
        input[type="date"] {
            padding: 9px 12px;
            border: 1.5px solid var(--grey-200);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: var(--grey-50);
            color: var(--grey-800);
            transition: border-color .15s;
        }
        input[type="date"]:focus { border-color: var(--blue); background: white; }

        /* ── BUTTONS ──────────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity .15s, transform .1s;
            text-decoration: none;
        }
        .btn:active { transform: scale(.97); }
        .btn-primary   { background: var(--blue);  color: white; }
        .btn-primary:hover { opacity: .88; }
        .btn-success   { background: var(--green); color: white; }
        .btn-success:hover { opacity: .88; }
        .btn-danger    { background: var(--red);   color: white; }
        .btn-danger:hover { opacity: .88; }
        .btn-ghost     { background: var(--grey-100); color: var(--grey-600); border: 1.5px solid var(--grey-200); }
        .btn-ghost:hover { background: var(--grey-200); }
        .btn-teal      { background: var(--teal);  color: white; }
        .btn-teal:hover { opacity: .88; }
        .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 6px; }

        /* ── STATUS TOAST ─────────────────────────────────────── */
        #statusDisplay {
            display: none;
            background: var(--blue-lt);
            color: var(--blue);
            border: 1px solid #b6d4f9;
            border-radius: 8px;
            padding: 12px 18px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
        }
        #statusDisplay.success { background: var(--green-lt); color: var(--green); border-color: #bbf7d0; }
        #statusDisplay.error   { background: var(--red-lt);   color: var(--red);   border-color: #fecaca; }

        /* ── RECORDS TABLE ────────────────────────────────────── */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--grey-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .card-header h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--navy);
        }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead th {
            background: var(--grey-50);
            color: var(--grey-600);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--grey-200);
            white-space: nowrap;
        }
        tbody tr { border-bottom: 1px solid var(--grey-100); transition: background .1s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--grey-50); }
        tbody td { padding: 13px 16px; vertical-align: middle; }
        .patient-name { font-weight: 600; color: var(--navy); }
        .patient-reg  { font-size: 13px; color: var(--grey-600); font-family: monospace; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            background: var(--teal-lt);
            color: var(--teal);
        }
        .date-cell { color: var(--grey-600); font-size: 13px; white-space: nowrap; }
        .action-cell { display: flex; gap: 8px; flex-wrap: wrap; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--grey-400);
        }
        .empty-state svg { margin-bottom: 12px; opacity: .4; }
        .empty-state p { font-size: 15px; }

        /* ── MODAL ────────────────────────────────────────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10,37,64,.45);
            z-index: 500;
            overflow-y: auto;
            padding: 24px 12px;
        }
        .modal-box {
            background: white;
            max-width: 860px;
            margin: 0 auto;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(10,37,64,.2);
            overflow: hidden;
        }

        /* modal top bar */
        .modal-topbar {
            background: var(--navy);
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .modal-topbar h2 {
            color: white;
            font-size: 17px;
            font-weight: 600;
            flex: 1;
            min-width: 0;
        }
        .modal-topbar h2 span {
            color: var(--grey-400);
            font-weight: 400;
            font-size: 14px;
            display: block;
            margin-top: 1px;
        }
        /* button group in modal header — wraps neatly on mobile */
        .modal-btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* modal body */
        .modal-body { padding: 24px; }
        .section-block {
            margin-bottom: 28px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--teal);
            border-bottom: 2px solid var(--teal-lt);
            padding-bottom: 6px;
            margin-bottom: 16px;
        }
        .field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px 24px;
        }
        .field-item label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--grey-400);
            margin-bottom: 4px;
        }
        .field-item .field-val {
            font-size: 14px;
            color: var(--grey-800);
            font-weight: 500;
            min-height: 22px;
        }
        .field-item input[type="text"],
        .field-item input[type="number"],
        .field-item input[type="date"] {
            width: 100%;
            padding: 8px 10px;
            border: 1.5px solid var(--grey-200);
            border-radius: 7px;
            font-size: 14px;
            font-family: inherit;
            color: var(--grey-800);
            background: var(--grey-50);
            outline: none;
            transition: border-color .15s;
        }
        .field-item input:focus { border-color: var(--blue); background: white; }
        .field-full { grid-column: 1 / -1; }
        .field-full textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1.5px solid var(--grey-200);
            border-radius: 7px;
            font-size: 14px;
            font-family: inherit;
            color: var(--grey-800);
            background: var(--grey-50);
            resize: vertical;
            min-height: 72px;
            outline: none;
            transition: border-color .15s;
        }
        .field-full textarea:focus { border-color: var(--blue); background: white; }
        .field-full .field-val {
            white-space: pre-wrap;
            line-height: 1.7;
        }
        .readonly-tag {
            font-size: 11px;
            background: var(--grey-100);
            color: var(--grey-600);
            border-radius: 4px;
            padding: 1px 6px;
            margin-left: 6px;
            vertical-align: middle;
        }

        /* skin prick test grid */
        .spt-controls {
            display: flex;
            gap: 24px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .spt-table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }
        .spt-group {
            background: var(--grey-50);
            border: 1px solid var(--grey-200);
            border-radius: 8px;
            overflow: hidden;
        }
        .spt-group-header {
            background: var(--navy);
            color: white;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 8px 12px;
        }
        .spt-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            border-bottom: 1px solid var(--grey-200);
            gap: 10px;
            font-size: 13px;
        }
        .spt-row:last-child { border-bottom: none; }
        .spt-row:nth-child(even) { background: white; }
        .spt-name { color: var(--grey-600); flex: 1; }
        .spt-val  { font-weight: 600; color: var(--navy); min-width: 40px; text-align: right; }
        .spt-row input {
            width: 70px;
            padding: 4px 8px;
            border: 1.5px solid var(--grey-200);
            border-radius: 5px;
            font-size: 13px;
            text-align: center;
            font-family: inherit;
            background: white;
            outline: none;
        }
        .spt-row input:focus { border-color: var(--blue); }

        /* edit mode banner */
        .edit-banner {
            display: none;
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--amber);
            margin-bottom: 20px;
        }
        .edit-banner.visible { display: block; }

        /* ── RESPONSIVE ───────────────────────────────────────── */
        @media (max-width: 640px) {
            .topbar-brand h1 { font-size: 15px; }
            .topbar-brand span { display: none; }
            .page { padding: 16px 12px 40px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .toolbar { gap: 8px; }
            .modal-box { border-radius: 10px; }
            .modal-topbar { padding: 14px 16px; }
            .modal-body { padding: 16px; }
            .field-grid { grid-template-columns: 1fr; }
            .spt-table-grid { grid-template-columns: 1fr; }
            .action-cell { gap: 6px; }
            .btn-sm { padding: 6px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

<!-- TOP NAV -->
<nav class="topbar">
    <div class="topbar-brand">
        <div class="topbar-icon">🏥</div>
        <div>
            <h1>Allergy Clinic</h1>
            <span>Patient Records Dashboard</span>
        </div>
    </div>
    <div class="topbar-nav">
        <a href="index.html">← New Intake Form</a>
    </div>
</nav>

<div class="page">

    <!-- STAT CARDS -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-label">Total Records</div>
            <div class="stat-value" id="statTotal">—</div>
        </div>
        <div class="stat-card green">
            <div class="stat-label">This Month</div>
            <div class="stat-value" id="statMonth">—</div>
        </div>
        <div class="stat-card amber">
            <div class="stat-label">Showing</div>
            <div class="stat-value" id="statShowing">—</div>
        </div>
    </div>

    <!-- STATUS TOAST -->
    <div id="statusDisplay"></div>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <div class="search-wrap">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="searchName" placeholder="Search by patient name…" oninput="filterRegistry()">
        </div>
        <input type="date" id="searchDate" onchange="filterRegistry()" title="Filter by date">
        <button class="btn btn-ghost" onclick="clearFilters()">Clear</button>
        <button class="btn btn-success" onclick="exportToExcel()">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export Excel
        </button>
    </div>

    <!-- RECORDS TABLE -->
    <div class="card">
        <div class="card-header">
            <h2>Patient Records</h2>
        </div>
        <div class="table-wrap">
            <table id="registryTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Patient</th>
                        <th>Reg #</th>
                        <th>Diagnosis</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="registryBody">
                    <tr><td colspan="5"><div class="empty-state"><p>Loading records…</p></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div><!-- /page -->


<!-- ── PATIENT RECORD MODAL ──────────────────────────────── -->
<div id="recordModal" class="modal-overlay">
    <div class="modal-box">

        <div class="modal-topbar">
            <h2 id="modalPatientTitle">
                Patient Record
                <span id="modalPatientSub"></span>
            </h2>
            <div class="modal-btn-group" id="modalBtnGroup">
                <!-- Buttons injected by JS -->
            </div>
        </div>

        <div class="modal-body">
            <div class="edit-banner" id="editBanner">✏️ Edit mode — make your changes below, then click Save.</div>
            <form id="editPatientForm" onsubmit="event.preventDefault();">
                <div id="modalDataBody"></div>
            </form>
        </div>

    </div>
</div>


<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxmKJMpHR2kv0Ko5R1rn0YP7x5VhNFPKCG1fMXMFlhkAlLJV177NWamBaaAYJ-cgdnIqg/exec";

    let globalRawData  = [];
    let parsedRecords  = [];
    let activeSelectedRecord = null;
    let isEditMode     = false;

    /* ── LOAD ─────────────────────────────────────────────── */
    window.onload = () => fetchRecordsFromLedger();

    function fetchRecordsFromLedger() {
        showStatus("Loading records…", "");
        fetch(WEB_APP_URL)
        .then(r => r.json())
        .then(data => {
            hideStatus();
            if (!data || data.length < 2) {
                showEmptyTable("No records found. Submit the first intake form to get started.");
                updateStats(0, 0, 0);
                return;
            }
            globalRawData = data;
            const headers = data[0];
            parsedRecords = data.slice(1).map((row, i) => {
                const obj = {
                    rowId: i,
                    rowNumber: i + 2};
                  };
                headers.forEach((h, j) => obj[h] = row[j] !== undefined ? row[j] : '';
                return obj;
            });
            renderRegistryRows(parsedRecords);
            updateStats(parsedRecords.length, countThisMonth(parsedRecords), parsedRecords.length);
        })
        .catch(err => {
            console.error(err);
            showStatus("Could not connect to Google Sheets. Check your network.", "error");
        });
    }

    function countThisMonth(records) {
        const now = new Date();
        return records.filter(r => {
            if (!r.Date) return false;
            const d = new Date(r.Date);
            return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        }).length;
    }

    function updateStats(total, month, showing) {
        document.getElementById('statTotal').textContent   = total;
        document.getElementById('statMonth').textContent   = month;
        document.getElementById('statShowing').textContent = showing;
    }

    /* ── RENDER TABLE ─────────────────────────────────────── */
    function renderRegistryRows(list) {
        const tbody = document.getElementById('registryBody');
        tbody.innerHTML = "";
        document.getElementById('statShowing').textContent = list.length;

        if (list.length === 0) {
            showEmptyTable("No records match your search.");
            return;
        }

        list.forEach(item => {
            const tr = document.createElement('tr');
            const dateVal = item.Date ? String(item.Date).split('T')[0] : 'N/A';
            tr.innerHTML = `
                <td class="date-cell">${dateVal}</td>
                <td>
                    <div class="patient-name">${item.Name || 'Unknown'}</div>
                </td>
                <td class="patient-reg">${item.RegNumber || '—'}</td>
                <td><span class="badge">${item.ProbableDiagnosis || 'Pending'}</span></td>
                <td>
                    <div class="action-cell">
                        <button class="btn btn-primary btn-sm" onclick="viewRecordDetails(${item._rowId})">View</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteRecordFromDatabase('${item.RegNumber}', '${(item.Name||'').replace(/'/g,"\\'")}')">Delete</button>
                    </div>
                </td>`;
            tbody.appendChild(tr);
        });
    }

    function showEmptyTable(msg) {
        document.getElementById('registryBody').innerHTML =
            `<tr><td colspan="5"><div class="empty-state"><p>${msg}</p></div></td></tr>`;
    }

    /* ── FILTER / SEARCH ──────────────────────────────────── */
    function filterRegistry() {
        const name = document.getElementById('searchName').value.toLowerCase();
        const date = document.getElementById('searchDate').value;
        const filtered = parsedRecords.filter(r => {
            const okName = (r.Name || '').toLowerCase().includes(name);
            const okDate = date ? (r.Date && String(r.Date).includes(date)) : true;
            return okName && okDate;
        });
        renderRegistryRows(filtered);
    }

    function clearFilters() {
        document.getElementById('searchName').value = '';
        document.getElementById('searchDate').value = '';
        renderRegistryRows(parsedRecords);
    }

    /* ── EXCEL EXPORT ─────────────────────────────────────── */
    function exportToExcel() {
        if (!parsedRecords.length) { alert("No records to export."); return; }
        const headers = globalRawData[0];
        const rows = [headers, ...parsedRecords.map(r => headers.map(h => r[h] ?? ''))];
        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Patients");
        XLSX.writeFile(wb, "Allergy_Clinic_Records.xlsx");
    }

    /* ── STATUS HELPERS ───────────────────────────────────── */
    function showStatus(msg, type) {
        const el = document.getElementById('statusDisplay');
        el.textContent = msg;
        el.className = type || '';
        el.style.display = 'block';
    }
    function hideStatus() {
        const el = document.getElementById('statusDisplay');
        el.style.display = 'none';
    }

    /* ── DELETE ───────────────────────────────────────────── */
    function deleteRecordFromDatabase(regNumber, name) {
        if (!confirm(`Delete the record for ${name} (Reg #${regNumber})?\n\nThis cannot be undone.`)) return;

        showStatus(`Deleting record for ${name}…`, "");

        fetch(WEB_APP_URL, {
            method: 'POST',
            cache: 'no-cache',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: "delete", RegNumber: String(regNumber) })
        })
        .then(r => r.json())
        .then(result => {
            if (result.status !== 'success') throw new Error(result.message);
            showStatus(`✅ Record for ${name} deleted.`, "success");
            setTimeout(() => { hideStatus(); fetchRecordsFromLedger(); }, 1800);
        })
        .catch(err => {
            showStatus(`❌ Delete failed: ${err.message}`, "error");
        });
    }

    /* ── VIEW / DISPLAY MODAL ─────────────────────────────── */
    function viewRecordDetails(rowId) {
        activeSelectedRecord = parsedRecords.find(r => r._rowId === rowId);
        if (!activeSelectedRecord) return;
        isEditMode = false;
        openModal();
    }

    function openModal() {
        renderModalContent();
        document.getElementById('recordModal').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('recordModal').style.display = 'none';
        document.body.style.overflow = '';
        isEditMode = false;
    }

    // Close modal when clicking the dark overlay background
    document.getElementById('recordModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    function renderModalContent() {
        const rec = activeSelectedRecord;

        // Header title
        document.getElementById('modalPatientTitle').childNodes[0].textContent =
            isEditMode ? `Editing: ${rec.Name || 'Patient'}` : (rec.Name || 'Patient Record');
        document.getElementById('modalPatientSub').textContent =
            `Reg #${rec.RegNumber || '—'}`;

        // Edit banner
        const banner = document.getElementById('editBanner');
        banner.className = isEditMode ? 'edit-banner visible' : 'edit-banner';

        // Header buttons
        const btnGroup = document.getElementById('modalBtnGroup');
        if (!isEditMode) {
            btnGroup.innerHTML = `
                <button class="btn btn-teal btn-sm" id="btnDownloadDoc">⬇ Download .docx</button>
                <button class="btn btn-primary btn-sm" onclick="enterEditMode()">✏️ Edit</button>
                <button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button>`;
            document.getElementById('btnDownloadDoc').addEventListener('click', downloadWordDoc);
        } else {
            btnGroup.innerHTML = `
                <button class="btn btn-success btn-sm" onclick="submitRecordEditsToCloud()">💾 Save Changes</button>
                <button class="btn btn-ghost btn-sm" onclick="cancelEdit()">✕ Cancel</button>`;
        }

        // Body
        document.getElementById('modalDataBody').innerHTML = buildModalHTML();
    }

    function enterEditMode() { isEditMode = true;  renderModalContent(); }
    function cancelEdit()    { isEditMode = false; renderModalContent(); }

        let val = activeSelectedRecord[key] || '';
        if (type === 'date' && String(val).includes('T')) val = val.split('T')[0];
        if (!isEditMode || readOnly) {
            return `<div class="field-val">${val || '—'}</div>`;
        }
        return `<input type="${type}" name="${key}" value="${String(val).replace(/"/g,'&quot;')}">`;
    }

    function ta(key) {
        const val = activeSelectedRecord[key] || '';
        if (!isEditMode) return `<div class="field-val">${val || '—'}</div>`;
        return `<textarea name="${key}">${val}</textarea>`;
    }

        if (!isEditMode) return `<span class="spt-val">${val || '—'}</span>`;

    /* ── SAVE EDITS ───────────────────────────────────────── */
    function submitRecordEditsToCloud() {
    if (!activeSelectedRecord) return;

    const btnGroup = document.getElementById('modalBtnGroup');
    btnGroup.innerHTML = `<span style="color:#94a3b8; font-size:14px; font-weight:600;">⏳ Saving…</span>`;

    const form = document.getElementById('editPatientForm');
    const formData = new FormData(form);
    const payload = { 
        action: "update", 
        rowNumber: activeSelectedRecord.rowNumber 
    };
    
    // Build payload with all fields
    for (let [key, val] of formData.entries()) {
        payload[key] = val;
    }
    
    // Also include any fields that might not be in the form (readonly fields in non-edit mode)
    // Get all input/textarea elements including those that might be divs
    const allFields = form.querySelectorAll('input, textarea, select');
    allFields.forEach(field => {
        if (field.name && !payload.hasOwnProperty(field.name)) {
            payload[field.name] = field.value;
        }
    });

    fetch(WEB_APP_URL, {
        method: 'POST',
        cache: 'no-cache',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(result => {
        if (result.status !== 'success') throw new Error(result.message || 'Unknown error');

        // Update local memory with all form values
        for (let [key, val] of formData.entries()) {
            activeSelectedRecord[key] = val;
        }
        
        // Also update the record in parsedRecords array
        const idx = parsedRecords.findIndex(r => r._rowId === activeSelectedRecord._rowId);
        if (idx !== -1) {
            for (let [key, val] of formData.entries()) {
                parsedRecords[idx][key] = val;
            }
        }

        isEditMode = false;
        renderModalContent();
        renderRegistryRows(parsedRecords); // Refresh the table immediately

        showStatus('✅ Record updated successfully.', 'success');
        setTimeout(() => { 
            hideStatus(); 
            fetchRecordsFromLedger(); // Full refresh from server
        }, 2200);
    })
    .catch(err => {
        alert('❌ Failed to save: ' + err.message);
        isEditMode = true;
        renderModalContent();
    });
}

                new TableRow({ children: [mc("Presenting Complaint",true,25), mc(rec.PresentingComplaint,false,75,3)] }),

                new TableRow({ children: [mc("Past Medical History",true,25), mc(rec.PastMedicalHistory,false,75,3)] }),
                new TableRow({ children: [mc("Drug History",true,25), mc(rec.DrugHistory,false,75,3)] }),
                new TableRow({ children: [mc("Past Surgical History",true,25), mc(rec.PastSurgicalHistory,false,75,3)] }),
                new TableRow({ children: [mc("Family History",true,25), mc(rec.FamilyHistory,false,75,3)] }),
            ]}),
            new Paragraph({ text: "" }),

        docx.Packer.toBlob(doc).then(blob => {
            saveAs(blob, `Allergy_Record_${rec.RegNumber || 'Patient'}.docx`);
        });
    }
</script>
