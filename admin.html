<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allergy Clinic - Admin Records Registry</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/docx@7.3.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --primary: #0b5cab;
            --primary-dark: #08457f;
            --secondary: #0f8fa3;
            --dark: #1f2937;
            --muted: #6b7280;
            --light: #f7f9fc;
            --surface: #ffffff;
            --border: #d8e0ea;
            --success: #218838;
            --danger: #c82333;
            --warning: #f0b429;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.55;
            color: var(--dark);
            background: linear-gradient(180deg, #eef4fb 0%, #f7f9fc 45%, #eef2f7 100%);
            margin: 0;
            padding: 28px 18px;
            min-height: 100vh;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            background: var(--surface);
            padding: 32px;
            border: 1px solid rgba(11, 92, 171, 0.12);
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(31, 41, 55, 0.10);
        }
        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding: 2px 0 22px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 18px;
        }
        .header-main h1 {
            color: var(--primary-dark);
            margin: 0;
            font-size: clamp(23px, 3vw, 30px);
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .header-subtitle { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--primary);
            background: #edf5ff;
            border: 1px solid #cfe3fb;
            border-radius: 9px;
            padding: 9px 13px;
            text-decoration: none;
            font-weight: 700;
        }
        .nav-link:hover { background: #e2efff; text-decoration: none; }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            margin-bottom: 20px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--light);
            flex-wrap: wrap;
        }
        .search-box {
            display: grid;
            grid-template-columns: minmax(230px, 1fr) minmax(170px, 0.65fr) auto;
            gap: 10px;
            flex: 1 1 620px;
            align-items: center;
        }
        .toolbar-actions { display: flex; gap: 9px; flex-wrap: wrap; }
        input[type="text"], input[type="date"], input[type="number"], select, textarea {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            width: 100%;
            background: #fff;
            color: var(--dark);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #74aee8;
            box-shadow: 0 0 0 3px rgba(11, 92, 171, 0.12);
        }
        textarea { resize: vertical; min-height: 60px; }
        button {
            padding: 10px 17px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.12s, box-shadow 0.12s, opacity 0.12s;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 5px 13px rgba(31, 41, 55, 0.14); }
        button:active { transform: translateY(0); }
        .btn-excel { background-color: var(--success); color: white; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-warning { background-color: var(--warning); color: #1f2937; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-close { background-color: #64748b; color: white; }
        .btn-action { padding: 7px 10px; font-size: 12px; margin: 2px; border-radius: 7px; }
        .btn-save { background-color: var(--success); color: white; padding: 12px 26px; font-size: 15px; }
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(31, 41, 55, 0.06);
        }
        table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; font-size: 14px; }
        th, td { padding: 13px 14px; border-bottom: 1px solid #e7edf4; }
        th {
            background: var(--primary-dark);
            color: white;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        th:first-child { border-top-left-radius: 11px; }
        th:last-child { border-top-right-radius: 11px; }
        tbody tr:nth-child(even) { background: #fbfcfe; }
        tbody tr:hover { background: #eef6ff; }
        tbody tr:last-child td { border-bottom: none; }
        .sort-button {
            appearance: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            text-align: left;
            box-shadow: none;
        }
        .sort-button:hover { transform: none; box-shadow: none; color: #dcecff; }
        .sort-indicator { min-width: 16px; text-align: center; opacity: 0.72; font-size: 13px; }
        .sort-indicator.active { opacity: 1; color: #ffffff; }
        .actions-header { min-width: 250px; }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.62);
            backdrop-filter: blur(3px);
            z-index: 1000;
            overflow-y: auto;
            padding: 40px 10px;
        }
        .modal-content {
            background: white;
            max-width: 980px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.45);
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.26);
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 13px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .modal-body h3 { color: var(--secondary); border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-top: 25px; }
        .modal-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 20px; }
        .modal-grid div { border-bottom: 1px solid #f1f3f5; padding: 4px 0; }
        .modal-grid strong { color: #495057; }
        .allergen-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 10px; font-size: 13px; }
        .allergen-col h4 { margin: 0 0 8px; color: var(--primary); }
        .allergen-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px dashed #e0e0e0; }
        .allergen-row input { width: 80px; padding: 4px 6px; text-align: center; font-size: 13px; }
        #statusDisplay { text-align: center; padding: 20px; font-weight: 700; color: var(--primary); }
        .edit-banner { background: #fff3cd; border: 1px solid #ffc107; padding: 10px 15px; border-radius: 7px; margin-bottom: 15px; font-weight: 700; color: #856404; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        .radio-group { display: flex; gap: 20px; }
        .radio-group label { font-weight: normal; display: flex; align-items: center; gap: 4px; }
        @media (max-width: 780px) {
            body { padding: 12px; }
            .container { padding: 20px 14px; border-radius: 12px; }
            .search-box { grid-template-columns: 1fr; }
            .toolbar-actions { width: 100%; }
            .toolbar-actions button { flex: 1; }
            .modal-grid, .allergen-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-main">
        <div>
            <h1>Clinical Master Records Registry</h1>
            <p class="header-subtitle">Search, review, update and print patient records.</p>
        </div>
        <a href="index.html" class="nav-link">← Back to Intake Form</a>
    </div>

    <div class="controls-row">
        <div class="search-box">
            <input type="text" id="searchName" placeholder="Filter by Patient Name..." oninput="filterRegistry()">
            <input type="date" id="searchDate" onchange="filterRegistry()">
            <button onclick="clearFilters()" class="btn-close">Reset</button>
        </div>
        <div class="toolbar-actions">
            <button onclick="exportToExcel()" class="btn-excel">Download Excel</button>
            <button onclick="fetchRecordsFromLedger()" class="btn-primary">Refresh Records</button>
        </div>
    </div>

    <div id="statusDisplay">Loading records from database...</div>

    <div class="table-responsive">
        <table id="registryTable">
            <thead>
                <tr>
                    <th><button type="button" class="sort-button" onclick="sortRegistry('Date')">Date Received <span class="sort-indicator" data-sort-key="Date">↕</span></button></th>
                    <th><button type="button" class="sort-button" onclick="sortRegistry('Name')">Patient Name <span class="sort-indicator" data-sort-key="Name">↕</span></button></th>
                    <th><button type="button" class="sort-button" onclick="sortRegistry('RegNumber')">Reg Number <span class="sort-indicator" data-sort-key="RegNumber">↕</span></button></th>
                    <th><button type="button" class="sort-button" onclick="sortRegistry('ProbableDiagnosis')">Probable Diagnosis <span class="sort-indicator" data-sort-key="ProbableDiagnosis">↕</span></button></th>
                    <th class="actions-header">Actions</th>
                </tr>
            </thead>
            <tbody id="registryBody">
            </tbody>
        </table>
    </div>
</div>

<!-- VIEW MODAL -->
<div id="recordModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalPatientTitle" style="margin:0; color:var(--primary);">Patient Record View</h2>
            <div>
                <button id="modalWordDownload" class="btn-excel" style="margin-right:10px;">Download .docx</button>
                <button id="modalEditBtn" class="btn-warning" style="margin-right:10px;">Edit Record</button>
                <button onclick="closeViewModal()" class="btn-close">Close</button>
            </div>
        </div>
        <div class="modal-body" id="modalDataBody"></div>
    </div>
</div>

<!-- EDIT MODAL -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 style="margin:0; color:var(--primary);">Edit Patient Record</h2>
            <div>
                <button onclick="saveAllEdits()" class="btn-save">Save All Changes</button>
                <button onclick="closeEditModal()" class="btn-close">Cancel</button>
            </div>
        </div>
        <div class="edit-banner">You are editing this record. Make changes below and click "Save All Changes".</div>
        <div id="editStatusMsg" style="display:none; padding:12px; border-radius:4px; margin-bottom:12px; font-weight:bold; text-align:center;"></div>
        <div class="modal-body" id="editModalBody"></div>
    </div>
</div>

<script>
    if (!sessionStorage.getItem('clinicAuth')) {
    window.location.href = 'login.html';
}
    // ═══════════════════════════════════════════

    // ═══════════════════════════════════════════
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxmKJMpHR2kv0Ko5R1rn0YP7x5VhNFPKCG1fMXMFlhkAlLJV177NWamBaaAYJ-cgdnIqg/exec";

    let globalRawData = [];
    let parsedRecords = [];
    let activeSelectedRecord = null;
    let sortState = { key: 'Date', direction: 'desc' };

    window.onload = function() {
        fetchRecordsFromLedger();
    };

    function fetchRecordsFromLedger() {
        var statusEl = document.getElementById('statusDisplay');
        statusEl.style.display = "block";
        statusEl.innerText = "Loading records...";
        statusEl.style.color = "#0056b3";
        statusEl.style.backgroundColor = "transparent";

        fetch(WEB_APP_URL)
        .then(function(response) {
            if (!response.ok) throw new Error("HTTP error: " + response.status);
            return response.json();
        })
        .then(function(data) {
            if (!data || data.length < 2) {
                statusEl.innerText = "No patient records found. Submit a form from index.html first.";
                globalRawData = data || [];
                parsedRecords = [];
                renderRegistryRows([]);
                return;
            }
            
            globalRawData = data;
            var headers = data[0];
            
            parsedRecords = data.slice(1).map(function(row, rIdx) {
                var obj = { _rowId: rIdx, _sheetRow: rIdx + 2 };
                headers.forEach(function(h, i) {
                    obj[h] = (row[i] !== undefined && row[i] !== null) ? row[i] : '';
                });
                return obj;
            });

            statusEl.style.display = "none";
            applyFiltersAndSort();
        })
        .catch(function(err) {
            console.error("Error:", err);
            statusEl.innerText = "ERROR loading records. Check console (F12) for details.";
            statusEl.style.color = "#721c24";
            statusEl.style.backgroundColor = "#f8d7da";
        });
    }

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function parseClinicDate(value) {
        if (value === undefined || value === null || value === '') return null;

        if (value instanceof Date && !isNaN(value.getTime())) return value;

        if (typeof value === 'number' && isFinite(value)) {
            // Supports Google Sheets/Excel serial dates as well as timestamps.
            if (value > 20000 && value < 100000) {
                return new Date(Math.round((value - 25569) * 86400 * 1000));
            }
            var numericDate = new Date(value);
            return isNaN(numericDate.getTime()) ? null : numericDate;
        }

        var text = String(value).trim();
        var match = text.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
        if (match) {
            return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
        }

        match = text.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
        if (match) {
            return new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1]));
        }

        var parsed = new Date(text);
        return isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatClinicDate(value) {
        var date = parseClinicDate(value);
        if (!date) return 'N/A';
        return String(date.getDate()).padStart(2, '0') + '/' +
            String(date.getMonth() + 1).padStart(2, '0') + '/' +
            date.getFullYear();
    }

    function compareRecords(a, b, key) {
        if (key === 'Date') {
            var dateA = parseClinicDate(a.Date);
            var dateB = parseClinicDate(b.Date);
            if (!dateA && !dateB) return a._rowId - b._rowId;
            if (!dateA) return 1;
            if (!dateB) return -1;
            return dateA.getTime() - dateB.getTime();
        }

        var valueA = String(a[key] || '').trim();
        var valueB = String(b[key] || '').trim();
        return valueA.localeCompare(valueB, undefined, { numeric: true, sensitivity: 'base' });
    }

    function getFilteredAndSortedRecords() {
        var nameQ = document.getElementById('searchName').value.trim().toLowerCase();
        var dateQ = document.getElementById('searchDate').value;

        var list = parsedRecords.filter(function(record) {
            var nameMatches = String(record.Name || '').toLowerCase().indexOf(nameQ) !== -1;
            var recordDate = parseClinicDate(record.Date);
            var dateMatches = true;

            if (dateQ) {
                var selectedDate = parseClinicDate(dateQ);
                dateMatches = Boolean(recordDate && selectedDate &&
                    recordDate.getFullYear() === selectedDate.getFullYear() &&
                    recordDate.getMonth() === selectedDate.getMonth() &&
                    recordDate.getDate() === selectedDate.getDate());
            }
            return nameMatches && dateMatches;
        });

        list.sort(function(a, b) {
            if (sortState.key === 'Date') {
                var dateA = parseClinicDate(a.Date);
                var dateB = parseClinicDate(b.Date);
                if (!dateA && !dateB) return b._rowId - a._rowId;
                if (!dateA) return 1;
                if (!dateB) return -1;
            }

            var result = compareRecords(a, b, sortState.key);
            return sortState.direction === 'asc' ? result : -result;
        });

        return list;
    }

    function updateSortIndicators() {
        document.querySelectorAll('.sort-indicator').forEach(function(indicator) {
            var isActive = indicator.getAttribute('data-sort-key') === sortState.key;
            indicator.textContent = isActive ? (sortState.direction === 'asc' ? '▲' : '▼') : '↕';
            indicator.classList.toggle('active', isActive);
        });
    }

    function applyFiltersAndSort() {
        renderRegistryRows(getFilteredAndSortedRecords());
        updateSortIndicators();
    }

    function sortRegistry(key) {
        if (sortState.key === key) {
            sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
        } else {
            sortState.key = key;
            sortState.direction = key === 'Date' ? 'desc' : 'asc';
        }
        applyFiltersAndSort();
    }

    function renderRegistryRows(list) {
        var tbody = document.getElementById('registryBody');
        tbody.innerHTML = "";
        
        if (!list || list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;">No records found.</td></tr>';
            return;
        }
        
        list.forEach(function(item) {
            var tr = document.createElement('tr');
            var dateVal = formatClinicDate(item.Date);
            tr.innerHTML = 
                '<td>' + dateVal + '</td>' +
                '<td><strong>' + escapeHTML(item.Name || 'Unknown') + '</strong></td>' +
                '<td>' + escapeHTML(item.RegNumber || '-') + '</td>' +
                '<td><span style="color:#17a2b8;font-weight:600;">' + escapeHTML(item.ProbableDiagnosis || 'No Diagnosis') + '</span></td>' +
                '<td>' +
                    '<button class="btn-primary btn-action" onclick="viewRecord(' + item._rowId + ')">View</button> ' +
                    '<button class="btn-warning btn-action" onclick="editRecord(' + item._rowId + ')">Edit</button> ' +
                    '<button class="btn-danger btn-action" onclick="deleteRecord(' + item._rowId + ')">Delete</button> ' +
                    '<button class="btn-action" style="background-color:#6c757d;color:white;" onclick="printRecord(' + item._rowId + ')">🖨 Print</button>' +
                '</td>';
            tbody.appendChild(tr);
        });
    }

    function filterRegistry() {
        applyFiltersAndSort();
    }

    function clearFilters() {
        document.getElementById('searchName').value = "";
        document.getElementById('searchDate').value = "";
        applyFiltersAndSort();
    }

    function exportToExcel() {
    if (!globalRawData || globalRawData.length < 2) {
        alert("No records to export.");
        return;
    }
    
    var headers = globalRawData[0];
    var refIndex = headers.indexOf('ReferralLetter');
    
    var exportData;
    if (refIndex !== -1) {
        exportData = globalRawData.map(function(row) {
            var newRow = [];
            for (var i = 0; i < row.length; i++) {
                if (i !== refIndex) newRow.push(row[i]);
            }
            return newRow;
        });
    } else {
        exportData = globalRawData;
    }
    
    var ws = XLSX.utils.aoa_to_sheet(exportData);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Patient Database");
    XLSX.writeFile(wb, "Allergy_Clinic_Records.xlsx");
}

   function printRecord(rowId) {
    var rec = parsedRecords.find(function(r) { return r._rowId === rowId; });
    if (!rec) return;

    var printWindow = window.open('', '_blank', 'width=980,height=760');
    if (!printWindow) {
        alert('The print window was blocked. Please allow pop-ups for this page and try again.');
        return;
    }

    function safe(value, fallback) {
        var output = value === undefined || value === null || value === '' ? (fallback || '-') : String(value);
        return output.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function safeLines(value) {
        return safe(value).replace(/\r?\n/g, '<br>');
    }

    var dateStr = formatClinicDate(rec.Date);
    var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title></title>';
    html += '<style>';
    html += '@page { size: A4 portrait; margin: 0; }';
    html += 'html, body { margin: 0; padding: 0; background: #fff; color: #000; }';
    html += 'body { font-family: Arial, Helvetica, sans-serif; font-size: 10.5pt; line-height: 1.28; }';
    html += '.print-page { box-sizing: border-box; width: 210mm; min-height: 297mm; margin: 0 auto; padding: 9mm 11mm; background: #fff; }';
    html += '.page-one { page-break-after: always; break-after: page; }';
    html += '.page-two { display: flex; flex-direction: column; }';
    html += 'h1 { margin: 0 0 5mm; text-align: center; color: #000; font-size: 17pt; line-height: 1.1; letter-spacing: .2pt; }';
    html += 'h2 { margin: 4mm 0 2mm; padding: 0 0 1.4mm; color: #000; border-bottom: .35mm solid #000; font-size: 12.5pt; line-height: 1.15; }';
    html += '.section { break-inside: avoid; page-break-inside: avoid; }';
    html += 'table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 0 0 3.2mm; }';
    html += 'td { padding: 2.2mm 2.4mm; border: .3mm solid #000; vertical-align: top; font-size: 10.5pt; overflow-wrap: anywhere; }';
    html += '.label { width: 23%; font-weight: 700; background: #fff; }';
    html += '.section-five { flex: 1; display: flex; flex-direction: column; }';
    html += '.control-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10mm; margin: 3mm 0 4mm; align-items: end; font-size: 10.5pt; }';
    html += '.control-item { display: flex; align-items: flex-end; white-space: nowrap; }';
    html += '.control-value { flex: 1; min-width: 35mm; min-height: 7mm; margin-left: 2.5mm; padding: 0 2mm 1mm; border-bottom: .4mm solid #000; font-weight: 600; }';
    html += '.allergen-table { height: 168mm; margin: 0; table-layout: fixed; }';
    html += '.allergen-table tr { height: 13.5mm; }';
    html += '.allergen-table td { padding: 2mm 2.1mm; border: .35mm solid #000; vertical-align: middle; font-size: 10.5pt; line-height: 1.15; overflow-wrap: normal; word-break: normal; }';

    function saveAllEdits() {
    var form = document.getElementById('editForm');
    if (!form) {
        alert("Edit form not found!");
        return;
    }

    var payload = {
        action: "update",
        RegNumber: activeSelectedRecord.RegNumber
    };
    
    var elements = form.querySelectorAll('input, select, textarea');
    var checkboxGroups = {};
    elements.forEach(function(el) {
        if (el.name) {
            if (el.type === 'radio') {
                if (el.checked) payload[el.name] = el.value;
            } else if (el.type === 'checkbox') {
                if (!checkboxGroups[el.name]) checkboxGroups[el.name] = [];
                if (el.checked) checkboxGroups[el.name].push(el.value);
            } else {
                payload[el.name] = el.value;
            }
        }
    });
    for (var key in checkboxGroups) {
        payload[key] = checkboxGroups[key].join(', ');
    }

    // Show saving message in edit modal
    var editMsg = document.getElementById('editStatusMsg');
    editMsg.style.display = "block";
    editMsg.style.backgroundColor = "#fff3cd";
    editMsg.style.color = "#856404";
    editMsg.innerText = "⏳ Saving changes...";

    var xhr = new XMLHttpRequest();
    xhr.open('POST', WEB_APP_URL, true);
    xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
    
    xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
            try {
                var result = JSON.parse(xhr.responseText);
                if (result.status === 'success') {
                    editMsg.style.backgroundColor = "#d4edda";
                    editMsg.style.color = "#155724";
                    editMsg.innerText = "✅ Record updated successfully!";
                    setTimeout(function() {
                        closeEditModal();
                        editMsg.style.display = "none";
                        fetchRecordsFromLedger();
                    }, 1500);
                } else {
                    editMsg.style.backgroundColor = "#f8d7da";
                    editMsg.style.color = "#721c24";
                    editMsg.innerText = "❌ " + (result.message || 'Error saving');
                }
            } catch(e) {
                editMsg.style.backgroundColor = "#d4edda";
                editMsg.style.color = "#155724";
                editMsg.innerText = "✅ Record updated!";
                setTimeout(function() {
                    closeEditModal();
                    editMsg.style.display = "none";
                    fetchRecordsFromLedger();
                }, 1500);
            }
        } else {
            editMsg.style.backgroundColor = "#f8d7da";
            editMsg.style.color = "#721c24";
            editMsg.innerText = "❌ Error: HTTP " + xhr.status;
        }
    };
    
    xhr.onerror = function() {
        editMsg.style.backgroundColor = "#f8d7da";
        editMsg.style.color = "#721c24";
        editMsg.innerText = "❌ Connection error. Please try again.";
    };
        
    
    xhr.send(JSON.stringify(payload));
}
    // ── DELETE ───────────────────────────────
    function deleteRecord(rowId) {
    var rec = parsedRecords.find(function(r) { return r._rowId === rowId; });
    if (!rec) return;
    if (!confirm('Delete record for ' + (rec.Name || 'Unknown') + ' (Reg #' + rec.RegNumber + ')? This cannot be undone.')) return;

    var statusEl = document.getElementById('statusDisplay');
    statusEl.style.display = "block";
    statusEl.innerText = "Deleting record...";
    statusEl.style.color = "#856404";
    statusEl.style.backgroundColor = "#fff3cd";

    var xhr = new XMLHttpRequest();
    xhr.open('POST', WEB_APP_URL, true);
    xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
    
    xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
            try {
                var result = JSON.parse(xhr.responseText);
                if (result.status === 'success') {
                    statusEl.innerText = "Record deleted successfully!";
                    statusEl.style.color = "#155724";
                    statusEl.style.backgroundColor = "#d4edda";
                    fetchRecordsFromLedger();
                    setTimeout(function() { statusEl.style.display = "none"; }, 3000);
                } else {
                    throw new Error(result.message || 'Unknown error');
                }
            } catch(e) {
                statusEl.innerText = "Record deleted! Refreshing...";
                statusEl.style.color = "#155724";
                statusEl.style.backgroundColor = "#d4edda";
                setTimeout(function() {
                    fetchRecordsFromLedger();
                    statusEl.style.display = "none";
                }, 2000);
            }
        } else {
            statusEl.innerText = "Error: HTTP " + xhr.status;
            statusEl.style.color = "#721c24";
            statusEl.style.backgroundColor = "#f8d7da";
        }
    };
    
    xhr.onerror = function() {
        statusEl.innerText = "Error: Could not connect to server.";
        statusEl.style.color = "#721c24";
        statusEl.style.backgroundColor = "#f8d7da";
    };
    
    xhr.send(JSON.stringify({ action: "delete", RegNumber: String(rec.RegNumber) }));
}

    // ── WORD DOC DOWNLOAD ────────────────────
document.getElementById('modalWordDownload').addEventListener('click', function() {
    if (!activeSelectedRecord) return;
    var data = activeSelectedRecord;

    const { Document, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, BorderStyle, HeadingLevel } = docx;

    const borderStyle = { style: BorderStyle.SINGLE, size: 4, color: "DEE2E6" };
    const cellPadding = { top: 100, bottom: 100, left: 150, right: 150 };

    function makeCell(text, bold, width, colspan) {
        if (bold === undefined) bold = false;
        if (width === undefined) width = 50;
        if (colspan === undefined) colspan = 1;
        return new TableCell({
            children: [new Paragraph({ children: [new TextRun({ text: String(text || "-"), bold: bold, size: 22 })] })],
            width: { size: width, type: WidthType.PERCENTAGE },
            columnSpan: colspan,
            borders: { top: borderStyle, bottom: borderStyle, left: borderStyle, right: borderStyle },
            margins: cellPadding
        });
    }

    function makeCellWithBreaks(text, bold, width, colspan) {
        if (bold === undefined) bold = false;
        if (width === undefined) width = 50;
        if (colspan === undefined) colspan = 1;
        var lines = String(text || "-").split('\n');
        var children = [];
        lines.forEach(function(line, i) {
            children.push(new TextRun({ text: line, bold: bold, size: 22 }));
            if (i < lines.length - 1) {
                children.push(new TextRun({ break: 1 }));
            }
        });
        return new TableCell({
            children: [new Paragraph({ children: children })],
            width: { size: width, type: WidthType.PERCENTAGE },
            columnSpan: colspan,
            borders: { top: borderStyle, bottom: borderStyle, left: borderStyle, right: borderStyle },
            margins: cellPadding
        });
    }

    var dateStr = data.Date ? String(data.Date).split('T')[0] : '';

    const doc = new Document({
        sections: [{
            properties: {},
            children: [
                new Paragraph({ text: "ALLERGY CLINIC – PATIENT HISTORY RECORD", heading: HeadingLevel.HEADING_1, alignment: "center" }),
                new Paragraph({ text: "\n" }),
                
                new Paragraph({ text: "1. Patient Demographics", heading: HeadingLevel.HEADING_2 }),
                new Table({
                    width: { size: 100, type: WidthType.PERCENTAGE },
                    rows: [
                        new TableRow({ children: [makeCell("Name", true, 25), makeCell(data.Name, false, 25), makeCell("Reg Number", true, 25), makeCell(data.RegNumber, false, 25)] }),
                        new TableRow({ children: [makeCell("Age (Years) / Gender", true, 25), makeCell((data.Age || '') + 'Y / ' + (data.Gender || ''), false, 25), makeCell("Date", true, 25), makeCell(dateStr, false, 25)] }),
                        new TableRow({ children: [makeCell("Contact Number", true, 25), makeCell(data.ContactNumber, false, 25), makeCell("Hometown", true, 25), makeCell(data.Hometown, false, 25)] }),
                        new TableRow({ children: [makeCell("Occupation", true, 25), makeCell(data.Occupation, false, 25), makeCell("Referred By", true, 25), makeCell(data.ReferredBy, false, 25)] })
                    ]
                }),
                new Paragraph({ text: "\n" }),

                new Paragraph({ text: "2. Clinical Presentation", heading: HeadingLevel.HEADING_2 }),
                new Table({
                    width: { size: 100, type: WidthType.PERCENTAGE },
                    rows: [
                        new TableRow({ children: [makeCell("Age of Onset (Years)", true, 25), makeCell(data.AgeOfOnset, false, 25), makeCell("Anaphylaxis Episodes", true, 25), makeCell(data.Anaphylaxis, false, 25)] }),
                        new TableRow({ children: [makeCell("Presenting Complaint", true, 25), makeCellWithBreaks(data.PresentingComplaint, false, 75, 3)] }),
                        new TableRow({ children: [makeCell("Investigations Done", true, 25), makeCellWithBreaks(data.InvestigationsDone, false, 75, 3)] }),
                        new TableRow({ children: [makeCell("Referral Letter", true, 25), makeCellWithBreaks(data.ReferralLetter, false, 75, 3)] }),
                        new TableRow({ children: [makeCell("Carries Epipen / Adrenaline", true, 25), makeCell(data.CarriesEpipen, false, 75, 3)] })
                    ]
                }),
                new Paragraph({ text: "\n" }),

                new Paragraph({ text: "3. Allergy & Medical History", heading: HeadingLevel.HEADING_2 }),
                new Table({
                    width: { size: 100, type: WidthType.PERCENTAGE },
                    rows: [
                        new TableRow({ children: [makeCell("General Allergic History", true, 25), makeCell(data.GeneralAllergicHistory, false, 75, 3)] }),
                        new TableRow({ children: [makeCell("Drug Allergies", true, 25), makeCell(data.DrugAllergies, false, 25), makeCell("Food Allergies", true, 25), makeCell(data.FoodAllergies, false, 25)] }),
                        new TableRow({ children: [makeCell("Tick Bites", true, 25), makeCell(data.TickBites, false, 75, 3)] }),
                        new TableRow({ children: [makeCell("Past Medical History", true, 25), makeCell(data.PastMedicalHistory, false, 75, 3)] }),
                        new TableRow({ children: [makeCell("Drug History", true, 25), makeCell(data.DrugHistory, false, 75, 3)] }),
                        new TableRow({ children: [makeCell("Past Surgical History", true, 25), makeCell(data.PastSurgicalHistory, false, 75, 3)] }),
                        new TableRow({ children: [makeCell("Family History", true, 25), makeCell(data.FamilyHistory, false, 75, 3)] })
                    ]
                }),
                new Paragraph({ text: "\n" }),

                new Paragraph({ text: "4. Assessment & Management", heading: HeadingLevel.HEADING_2 }),
                new Table({
                    width: { size: 100, type: WidthType.PERCENTAGE },
                    rows: [
                        new TableRow({ children: [makeCell("Problem List", true, 25), makeCell(data.ProblemList, false, 75, 3)] }),
                        new TableRow({ children: [makeCell("Probable Diagnosis", true, 25), makeCellWithBreaks(data.ProbableDiagnosis, false, 25), makeCell("Review Plan", true, 25), makeCell(data.ReviewPlan, false, 25)] }),
                        new TableRow({ children: [makeCell("Investigations Ordered", true, 25), makeCell(data.InvestigationsOrdered, false, 75, 3)] }),
                        new TableRow({ children: [makeCell("Management Plan", true, 25), makeCell(data.ManagementPlan, false, 75, 3)] }),
                        new TableRow({ children: [makeCell("Prescription", true, 25), makeCell(data.Prescription, false, 75, 3)] })
                    ]
                }),
                new Paragraph({ text: "\n" }),

                new Paragraph({ text: "5. Skin Prick Test Results", heading: HeadingLevel.HEADING_2 }),
                new Paragraph({ text: "Positive Control (0.1% Histamine): " + (data.Histamine || "-") + "     Negative Control (N. Saline): " + (data.Saline || "-") + "\n\n" }),
                
                new Table({
                    width: { size: 100, type: WidthType.PERCENTAGE },
                    rows: [
                        new TableRow({ children: [makeCell("Allergen", true, 20), makeCell("Result", true, 13), makeCell("Allergen", true, 20), makeCell("Result", true, 13), makeCell("Allergen", true, 20), makeCell("Result", true, 14)] }),
                        new TableRow({ children: [makeCell("Beef (Extract)"), makeCell(data.BeefExtract), makeCell("House Dust Mite"), makeCell(data.HouseDustMite), makeCell("IV Penicillin"), makeCell(data.IVPenicillin)] }),
                        new TableRow({ children: [makeCell("Pork (Extract)"), makeCell(data.PorkExtract), makeCell("Storage Mite"), makeCell(data.StorageMite), makeCell("Oral Penicillin"), makeCell(data.OralPenicillin)] }),
                        new TableRow({ children: [makeCell("Beef (Raw)"), makeCell(data.BeefRaw), makeCell("Cockroach"), makeCell(data.Cockroach), makeCell("Amoxicillin"), makeCell(data.Amoxicillin)] }),
                        new TableRow({ children: [makeCell("Pork (Raw)"), makeCell(data.PorkRaw), makeCell("Cat epithelium"), makeCell(data.CatEpithelium), makeCell("Co-amoxiclav"), makeCell(data.CoAmoxiclav)] }),
                        new TableRow({ children: [makeCell("Milk"), makeCell(data.Milk), makeCell("Dog epithelium"), makeCell(data.DogEpithelium), makeCell("Cefalexin"), makeCell(data.Cefalexin)] }),
                        new TableRow({ children: [makeCell("Gelatin"), makeCell(data.Gelatin), makeCell("Mould Mix"), makeCell(data.MouldMix), makeCell("Cefuroxime"), makeCell(data.Cefuroxime)] }),
                        new TableRow({ children: [makeCell("Prawns"), makeCell(data.Prawns), makeCell("Grass Pollens"), makeCell(data.GrassPollens), makeCell("Cefotaxime/Ceftriaxone"), makeCell(data.CefotaximeCeftriaxone)] }),
                        new TableRow({ children: [makeCell("Tuna"), makeCell(data.Tuna), makeCell("Weed Pollens"), makeCell(data.WeedPollens), makeCell("Meropenem"), makeCell(data.Meropenem)] }),
                        new TableRow({ children: [makeCell("Salmon"), makeCell(data.Salmon), makeCell("Aspergillus"), makeCell(data.Aspergillus), makeCell("Omeprazole"), makeCell(data.Omeprazole)] }),
                        new TableRow({ children: [makeCell("Eggs"), makeCell(data.Eggs), makeCell("Wheat"), makeCell(data.Wheat), makeCell("Infliximab/Adalimumab"), makeCell(data.InfliximabAdalimumab)] }),
                        new TableRow({ children: [makeCell("Chicken"), makeCell(data.Chicken), makeCell(""), makeCell(""), makeCell(""), makeCell("")] })
                    ]
                })
            ]
        }]
    });

    docx.Packer.toBlob(doc).then(function(blob) {
        saveAs(blob, 'Allergy_Record_' + (data.RegNumber || 'Unknown') + '.docx');
    });
});

    // Close modals when clicking outside
    document.getElementById('recordModal').addEventListener('click', function(e) {
        if (e.target === this) closeViewModal();
    });
    document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) closeEditModal();
